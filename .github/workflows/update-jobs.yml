name: Update jobs

# GitHub schedules run in UTC, and 7pm Chicago time is 00:00 UTC in summer (CDT)
# but 01:00 UTC in winter (CST). Both times are scheduled; the check step lets
# only the one matching today's daylight-saving state through.
on:
  schedule:
    - cron: "0 0 * * 3"   # 7pm CDT Tuesday
    - cron: "0 1 * * 3"   # 7pm CST Tuesday
  workflow_dispatch:       # "Run workflow" button for manual updates

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check it's 7pm in Chicago
        id: check
        run: |
          offset=$(TZ=America/Chicago date +%z)
          if [ "${{ github.event_name }}" != "schedule" ] \
            || { [ "$offset" = "-0500" ] && [ "${{ github.event.schedule }}" = "0 0 * * 3" ]; } \
            || { [ "$offset" = "-0600" ] && [ "${{ github.event.schedule }}" = "0 1 * * 3" ]; }; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.check.outputs.run == 'true'
        with:
          python-version: "3.12"

      - name: Collect jobs
        if: steps.check.outputs.run == 'true'
        run: python scraper/scrape.py

      - name: Publish
        if: steps.check.outputs.run == 'true'
        run: |
          git config user.name "jobs-bot"
          git config user.email "jobs-bot@users.noreply.github.com"
          git add docs/jobs.json
          git commit -m "Weekly jobs update" || echo "No changes"
          git push
